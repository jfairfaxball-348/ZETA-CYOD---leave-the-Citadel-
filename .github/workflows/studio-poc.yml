name: ZETA Writing Studio POC
on:
  pull_request:
    paths:
      - 'studio/**'
      - '.github/workflows/studio-poc.yml'
  push:
    paths:
      - 'studio/**'
      - '.github/workflows/studio-poc.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test-only dependencies
        run: npm install --no-audit --no-fund
      - name: Check Cloudflare backend, recovery and reader paths
        run: npm test
      - name: Verify local Cloudflare D1 migration
        run: npm run cf:local-migrate
      - name: Verify Cloudflare Worker asset bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
      - name: Confirm local Wrangler D1 database saves and restores over HTTP
        run: node tests/d1-http.cjs
