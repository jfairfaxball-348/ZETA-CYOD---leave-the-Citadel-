name: ZETA private manuscript backup
on:
  schedule:
    - cron: '17 02 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read authenticated cloud manuscript and archive to private repository
        env:
          ZETA_BACKUP_REQUIRED: '1'
          STUDIO_URL: ${{ secrets.ZETA_BACKUP_STUDIO_URL }}
          STUDIO_OWNER_TOKEN: ${{ secrets.ZETA_BACKUP_OWNER_TOKEN }}
          GITHUB_BACKUP_TOKEN: ${{ secrets.ZETA_BACKUP_GITHUB_TOKEN }}
          GITHUB_BACKUP_REPO: ${{ secrets.ZETA_BACKUP_GITHUB_REPO }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.ZETA_BACKUP_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.ZETA_BACKUP_CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/private-backup.cjs
